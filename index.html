<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graha-Bhedam Finder</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background-color: #d8f8b0;
  padding: 12px;
  color: #000;
}

.main-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* Banner */
.banner {
  background-color: #d81b60;
  color: white;
  text-align: center;
  padding: 10px 15px;
  max-width: 480px;
  margin: 0 auto;
  box-shadow: 2px 3px 6px rgba(0,0,0,0.25);
  border-radius: 4px;
  width: 100%;
}

.banner h1 {
  font-size: 20px;
  letter-spacing: 1px;
  font-weight: bold;
  text-transform: uppercase;
  font-family: 'Times New Roman', Times, serif;
}

.banner .note-box {
  background-color: #4a151b;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 10px;
  display: inline-block;
  margin-top: 5px;
}

/* Controls Panel */
.controls-panel {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  flex-direction: column;
}

/* Scrollable Swara Wrapper for Mobile */
.swara-grid-wrapper {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 8px;
  display: flex;
  justify-content: center;
  -webkit-overflow-scrolling: touch;
}

.swara-grid {
  display: grid;
  grid-template-columns: repeat(13, minmax(36px, 1fr));
  grid-template-rows: repeat(2, 44px);
  gap: 4px;
  min-width: 500px; /* Prevents buttons from squishing below readable sizes */
}

.swara-btn {
  background-color: #a8d8fc;
  border: 1px solid #336699;
  color: #000;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 2px 3px rgba(0,0,0,0.25);
  user-select: none;
  border-radius: 3px;
  touch-action: manipulation;
}

.swara-btn:hover {
  background-color: #8cc2f2;
}

.swara-btn.selected {
  background-color: #ffcc00 !important;
  color: #331f00 !important;
  border: 2px solid #b8860b !important;
  box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4) !important;
  font-weight: 900 !important;
}

/* Action Buttons Container */
.action-panel {
  display: flex;
  gap: 10px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
}

.match-btn-grid {
  display: grid;
  grid-template-columns: repeat(2, 160px);
  gap: 8px;
}

.btn-action {
  background-color: #555555;
  color: #ffffff;
  border: 1px solid #333333;
  padding: 10px 8px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  border-radius: 3px;
  min-height: 44px;
}

.btn-action.active-mode {
  background-color: #1e40af !important;
  color: #ffffff !important;
  border: 2px solid #1d4ed8 !important;
}

.btn-clear {
  background-color: #d97706;
  color: #000;
  border: 1px solid #92400e;
  font-weight: bold;
  font-size: 13px;
  width: 100px;
  cursor: pointer;
  padding: 8px;
  border-radius: 3px;
  min-height: 44px;
}

/* Output Area */
.output-container {
  background-color: #e0f7fa;
  border: 1px solid #80deea;
  min-height: 350px;
  padding: 14px;
  border-radius: 4px;
}

.output-header {
  font-weight: bold;
  font-size: 15px;
  color: #006064;
  margin-bottom: 12px;
  border-bottom: 2px solid #80deea;
  padding-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.db-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 3px;
}
.db-badge.success { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
.db-badge.loading { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
.db-badge.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

.shift-row {
  background: #ffffff;
  border: 1px solid #b2ebf2;
  border-left: 6px solid #00838f;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 4px;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 16px;
}

.shift-meta {
  width: 210px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.shift-meta .output-num {
  font-weight: bold;
  color: #d81b60;
  font-size: 14px;
}

.shift-meta .swara-info {
  font-size: 13px;
  font-weight: bold;
  color: #006064;
}

.btn-audio-play {
  background-color: #0284c7;
  color: #ffffff;
  border: none;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  min-height: 38px;
  width: fit-content;
}

.possibilities-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
  flex: 1;
  width: 100%;
}

.possibility-card {
  background-color: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 5px;
  padding: 10px;
  text-align: center;
}

.possibility-card.matched-card {
  background-color: #f0fdf4;
  border: 2px solid #22c55e;
}

.lbl-possibility { color: #475569; font-size: 12px; margin-bottom: 4px; }
.scale-line { margin-bottom: 6px; font-size: 13px; }
.lbl-derived-scale { color: #0284c7; font-weight: bold; font-size: 13px; }
.swara-scale-val { font-family: monospace; font-weight: 800; font-size: 12px; }
.lbl-raga { color: #dc2626; font-weight: bold; font-size: 13px; }
.raga-val-text { font-weight: bold; color: #111827; }
.no-match-text { color: #64748b; font-weight: bold; font-style: italic; }

/* Mobile Specific Breakpoints */
@media (max-width: 768px) {
  body { padding: 8px; }
  .swara-grid-wrapper { justify-content: flex-start; }
  .match-btn-grid { grid-template-columns: 1fr; width: 100%; }
  .action-panel { flex-direction: column; align-items: stretch; }
  .btn-clear { width: 100%; }
  .shift-row { flex-direction: column; }
  .shift-meta { width: 100%; }
  .possibilities-container { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>

<div class="main-container">
  <!-- Top Banner -->
  <div class="banner">
    <h1>ENTER YOUR RAGA</h1>
    <div class="note-box">NOTE: It should be a non-vakram entry</div>
  </div>

  <!-- Swara Keyboard and Buttons Panel -->
  <div class="controls-panel">
    <!-- Swara Grid Keyboard -->
    <div class="swara-grid" id="swaraGrid">
      <!-- Row 1 -->
      <button class="swara-btn" style="grid-column: 1; grid-row: 1;" data-pitch="0" data-swara="S">S</button>
      <button class="swara-btn" style="grid-column: 2; grid-row: 1;" data-pitch="1" data-swara="R1">R1</button>
      <button class="swara-btn" style="grid-column: 3; grid-row: 1;" data-pitch="2" data-swara="R2">R2</button>
      <button class="swara-btn" style="grid-column: 4; grid-row: 1;" data-pitch="3" data-swara="G2">G2</button>
      <button class="swara-btn" style="grid-column: 5; grid-row: 1;" data-pitch="4" data-swara="G3">G3</button>
      <button class="swara-btn" style="grid-column: 6; grid-row: 1;" data-pitch="5" data-swara="M1">M1</button>
      <button class="swara-btn" style="grid-column: 7; grid-row: 1;" data-pitch="6" data-swara="M2">M2</button>
      <button class="swara-btn" style="grid-column: 8; grid-row: 1;" data-pitch="7" data-swara="P">P</button>
      <button class="swara-btn" style="grid-column: 9; grid-row: 1;" data-pitch="8" data-swara="D1">D1</button>
      <button class="swara-btn" style="grid-column: 10; grid-row: 1;" data-pitch="9" data-swara="D2">D2</button>
      <button class="swara-btn" style="grid-column: 11; grid-row: 1;" data-pitch="10" data-swara="N2">N2</button>
      <button class="swara-btn" style="grid-column: 12; grid-row: 1;" data-pitch="11" data-swara="N3">N3</button>
      <button class="swara-btn" style="grid-column: 13; grid-row: 1;" data-pitch="12" data-swara="S">S</button>

      <!-- Row 2 -->
      <button class="swara-btn" style="grid-column: 3; grid-row: 2;" data-pitch="2" data-swara="G1">G1</button>
      <button class="swara-btn" style="grid-column: 4; grid-row: 2;" data-pitch="3" data-swara="R3">R3</button>
      <button class="swara-btn" style="grid-column: 10; grid-row: 2;" data-pitch="9" data-swara="N1">N1</button>
      <button class="swara-btn" style="grid-column: 11; grid-row: 2;" data-pitch="10" data-swara="D3">D3</button>
    </div>

    <!-- Action Buttons -->
    <div class="action-panel">
      <div class="match-btn-grid">
        <button class="btn-action" id="btn-aarohanam">Match only<br>Aarohanam</button>
        <button class="btn-action" id="btn-both">Match Aarohanam<br>& Avarohanam</button>
        <button class="btn-action" id="btn-avarohanam">Match only<br>Avarohanam</button>
        <button class="btn-action" id="btn-melakarta">Match<br>only Melakartas</button>
      </div>
      <button class="btn-clear" id="btn-clear">Clear<br>matches</button>
    </div>
  </div>

  <!-- Output Box Container -->
  <div class="output-container" id="outputArea">
    <div class="output-header">
      <span>Graha Bhedam Results & Matching Ragas</span>
      <div id="dbStatus" class="db-badge loading">Loading Ragas_Table.csv...</div>
    </div>
    <p style="color: #555; font-style: italic;">Select swaras on the grid above and click a match button to generate modal shifts and view matching ragas.</p>
  </div>
</div>

<div class="swara-grid-wrapper">
  <div class="swara-grid" id="swaraGrid">
    <!-- Swara buttons go here -->
  </div>
</div>

<script>
// Semitone Pitch Mapping Table
const PITCH_MAP = {
  0: ["S"],
  1: ["R1"],
  2: ["R2", "G1"],
  3: ["R3", "G2"],
  4: ["G3"],
  5: ["M1"],
  6: ["M2"],
  7: ["P"],
  8: ["D1"],
  9: ["D2", "N1"],
  10: ["D3", "N2"],
  11: ["N3"]
};

// Swara relative semitone offsets from S
const SWARA_SEMITONE_OFFSETS = {
  'S': 0,
  'R1': 1,
  'R2': 2, 'G1': 2,
  'R3': 3, 'G2': 3,
  'G3': 4,
  'M1': 5,
  'M2': 6,
  'P': 7,
  'D1': 8,
  'D2': 9, 'N1': 9,
  'D3': 10, 'N2': 10,
  'N3': 11
};

let ragasDatabase = [];
let isDatabaseLoaded = false;
let audioCtx = null;

// Helper to play a single synthesis note
function playNote(totalSemitoneShift, noteStartTime, noteDuration) {
  const baseTonicFreq = 220 * Math.pow(2, 7 / 12); // Base S frequency (~329.63 Hz)
  const freq = baseTonicFreq * Math.pow(2, totalSemitoneShift / 12);

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, noteStartTime);

  // Envelope for smooth attack & decay
  gain.gain.setValueAtTime(0.001, noteStartTime);
  gain.gain.exponentialRampToValueAtTime(0.3, noteStartTime + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, noteStartTime + noteDuration - 0.02);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(noteStartTime);
  osc.stop(noteStartTime + noteDuration);
}

// Audio Synthesis Function: Plays Aarohanam, pauses, and plays Avarohanam starting with Upper S
function playRagaAudio(shiftTonic, scaleArray) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  // Convert scale swaras to relative semitones
  let semitones = scaleArray.map((swara, idx) => {
    if (idx === scaleArray.length - 1 && swara === 'S') {
      return 12; // Upper S (+12 semitones)
    }
    return SWARA_SEMITONE_OFFSETS[swara] || 0;
  });

  const noteDuration = 0.35;  // Duration of each note in seconds
  const pauseDuration = 0.35; // Pause between Aarohanam & Avarohanam
  const startTime = audioCtx.currentTime;

  let currentOffsetTime = 0;

  // 1. Play Aarohanam (Ascending) e.g., [S, R2, G3, P, D2, Upper_S]
  semitones.forEach((semitoneOffset) => {
    playNote(shiftTonic + semitoneOffset, startTime + currentOffsetTime, noteDuration);
    currentOffsetTime += noteDuration;
  });

  // 2. Pause between ascending and descending
  currentOffsetTime += pauseDuration;

  // 3. Play Avarohanam (Descending), starting with Upper S again e.g., [Upper_S, D2, P, G3, R2, S]
  const avarohanamSemitones = [...semitones].reverse();
  avarohanamSemitones.forEach((semitoneOffset) => {
    playNote(shiftTonic + semitoneOffset, startTime + currentOffsetTime, noteDuration);
    currentOffsetTime += noteDuration;
  });
}

// Load CSV from file path or file reader
function loadDatabaseFromCSV(csvText) {
  ragasDatabase = parseCSV(csvText);
  isDatabaseLoaded = true;
  const dbStatus = document.getElementById('dbStatus');
  if (ragasDatabase.length > 0) {
    dbStatus.className = 'db-badge success';
    dbStatus.textContent = `✓ Database Active (${ragasDatabase.length} Ragas loaded from Ragas_Table.csv)`;
  } else {
    dbStatus.className = 'db-badge error';
    dbStatus.textContent = '⚠️ Ragas_Table.csv was empty or invalid.';
  }
}

// Initial Fetch of Ragas_Table.csv
fetch('Ragas_Table.csv')
  .then(res => {
    if (!res.ok) throw new Error('HTTP Error ' + res.status);
    return res.text();
  })
  .then(text => loadDatabaseFromCSV(text))
  .catch(err => {
    console.warn("Automated fetch failed (likely local file:// CORS).", err);
    const dbStatus = document.getElementById('dbStatus');
    dbStatus.className = 'db-badge error';
    dbStatus.innerHTML = `
      <span>⚠️ Could not auto-load Ragas_Table.csv.</span>
      <label class="file-input-wrapper">
        <u>Select CSV manually</u>:
        <input type="file" accept=".csv" onchange="handleFileSelect(event)" style="font-size:11px;">
      </label>
    `;
  });

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => loadDatabaseFromCSV(e.target.result);
    reader.readAsText(file);
  }
}

// Parse CSV with header detection
function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  if (lines.length < 2) return [];

  const headers = parseCSVRow(lines[0]).map(h => h.trim().toLowerCase());
  const ragaIdx = headers.indexOf('raga');
  const classIdx = headers.indexOf('raga_class');
  const melaIdx = headers.indexOf('melakarta');
  const aaroIdx = headers.indexOf('aarohanam');
  const avaroIdx = headers.indexOf('avarohanam');

  const results = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVRow(lines[i]);
    if (cols.length >= 4) {
      const name = (ragaIdx >= 0 && cols[ragaIdx]) ? cols[ragaIdx].trim() : cols[0].trim();
      const ragaClass = (classIdx >= 0 && cols[classIdx]) ? cols[classIdx].trim() : (cols[1] ? cols[1].trim() : '');
      const melakartaNum = (melaIdx >= 0 && cols[melaIdx]) ? cols[melaIdx].trim() : (cols[2] ? cols[2].trim() : '');
      const aarohanam = (aaroIdx >= 0 && cols[aaroIdx]) ? cols[aaroIdx].trim() : (cols[3] ? cols[3].trim() : '');
      const avarohanam = (avaroIdx >= 0 && cols[avaroIdx]) ? cols[avaroIdx].trim() : (cols[4] ? cols[4].trim() : '');

      if (name && aarohanam) {
        results.push({
          name: name,
          ragaClass: ragaClass,
          melakartaNum: melakartaNum,
          aarohanam: aarohanam,
          avarohanam: avarohanam,
          isMelakarta: ragaClass.toLowerCase() === 'melakarta'
        });
      }
    }
  }
  return results;
}

function parseCSVRow(line) {
  const row = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"' || char === "'") {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      row.push(current.replace(/^["']|["']$/g, ''));
      current = '';
    } else {
      current += char;
    }
  }
  row.push(current.replace(/^["']|["']$/g, ''));
  return row;
}

// Read Selected Swaras from Keyboard
function getSelectedSwaraList() {
  const selectedElements = Array.from(document.querySelectorAll('.swara-btn.selected'));
  const list = [];
  selectedElements.forEach(btn => {
    list.push({
      swara: btn.dataset.swara,
      pitch: parseInt(btn.dataset.pitch) % 12
    });
  });
  return list;
}

// Build Enharmonic Combinations
function buildScaleCombinations(pitches) {
  const options = pitches.map(p => PITCH_MAP[p]);
  const results = [];

  function helper(index, current) {
    if (index === options.length) {
      results.push([...current]);
      return;
    }
    for (let opt of options[index]) {
      current.push(opt);
      helper(index + 1, current);
      current.pop();
    }
  }

  helper(0, []);
  return results;
}

// Validate Carnatic Swara Rules
function isValidCarnaticScale(swaraList) {
  const prefixes = swaraList.map(s => s[0]);
  const uniquePrefixes = new Set(prefixes);
  
  if (!swaraList.includes('S')) return false;
  if (uniquePrefixes.size !== swaraList.length) return false;

  if (swaraList.includes('G1') && (swaraList.includes('R2') || swaraList.includes('R3'))) return false;
  if (swaraList.includes('G2') && swaraList.includes('R3')) return false;
  if (swaraList.includes('N1') && (swaraList.includes('D2') || swaraList.includes('D3'))) return false;
  if (swaraList.includes('N2') && swaraList.includes('D3')) return false;

  return true;
}

function normalizeSwaraString(str) {
  if (!str) return '';
  return str.trim().replace(/,/g, ' ').split(/\s+/).join(' ').toUpperCase();
}

// Reverse Avarohanam scale sequence
function reverseSwaraString(str) {
  if (!str) return '';
  const swaras = str.trim().replace(/,/g, ' ').split(/\s+/);
  swaras.reverse();
  return swaras.join(' ').toUpperCase();
}

// Core Output Renderer
function computeAndMatch(matchMode, targetButton) {
  const selectedList = getSelectedSwaraList();
  const outputArea = document.getElementById('outputArea');

  // Highlight Active Match Button
  document.querySelectorAll('.btn-action').forEach(b => b.classList.remove('active-mode'));
  if (targetButton) {
    targetButton.classList.add('active-mode');
  }

  if (!isDatabaseLoaded || ragasDatabase.length === 0) {
    outputArea.innerHTML = `
      <div class="output-header">Graha Bhedam Results</div>
      <div class="alert-box">Database Error: Ragas_Table.csv is not loaded. Please ensure Ragas_Table.csv is in the directory.</div>
    `;
    return;
  }

  if (selectedList.length === 0) {
    outputArea.innerHTML = `
      <div class="output-header">Graha Bhedam Results</div>
      <div class="alert-box">Input Error: Please select swaras from the keyboard grid above first.</div>
    `;
    return;
  }

  const selectedPitches = Array.from(new Set(selectedList.map(s => s.pitch))).sort((a, b) => a - b);
  const totalShifts = selectedPitches.length;

  let html = `<div class="output-header">
    <span>Graha Bhedam Results (${matchMode.toUpperCase()} MATCH)</span>
    <span style="font-size: 13px; color: #00838f;">${totalShifts} Shift Outputs Generated</span>
  </div>`;

  selectedPitches.forEach((shiftTonic, idx) => {
    const shiftedPitches = selectedPitches.map(p => (p - shiftTonic + 12) % 12).sort((a, b) => a - b);
    const candidateCombinations = buildScaleCombinations(shiftedPitches);
    const validScales = candidateCombinations.filter(isValidCarnaticScale);
    const shiftNoteNames = PITCH_MAP[shiftTonic].join('/');

    html += `
      <div class="shift-row">
        <!-- Left Metadata Column with Single Play Shifted Scale Button -->
        <div class="shift-meta">
          <div class="output-num">Graha Bhedam ${idx + 1} of ${totalShifts} —</div>
          <div class="swara-info">Shift on Swara: ${shiftNoteNames} (+${shiftTonic} semitones)</div>
          ${validScales.length > 0 ? `
            <button class="btn-audio-play" onclick="playRagaAudio(${shiftTonic}, ['${validScales[0].concat(['S']).join("','")}'])">
              ▶ Play Shifted Scale
            </button>
          ` : ''}
        </div>

        <!-- Right Side Possibilities Grid -->
        <div class="possibilities-container">
    `;

    if (validScales.length === 0) {
      html += `
        <div class="possibility-card">
          <div class="lbl-possibility">Possibility 1</div>
          <div class="no-match-text">Invalid Carnatic scale sequence</div>
        </div>
      `;
    } else {
      validScales.forEach((scale, scaleIdx) => {
        const fullScaleArr = scale.concat(['S']);
        const fullScaleStr = fullScaleArr.join(' ');
        const normCandidateStr = normalizeSwaraString(fullScaleStr);

        // Search matching ragas
        const matches = ragasDatabase.filter(raga => {
          const normAaro = normalizeSwaraString(raga.aarohanam);
          const revAvaro = reverseSwaraString(raga.avarohanam);

          if (matchMode === 'aarohanam') {
            return normAaro === normCandidateStr;
          } else if (matchMode === 'avarohanam') {
            return revAvaro === normCandidateStr;
          } else if (matchMode === 'both') {
            return normAaro === normCandidateStr && revAvaro === normCandidateStr;
          } else if (matchMode === 'melakarta') {
            return raga.isMelakarta && normAaro === normCandidateStr;
          }
          return false;
        });

        const hasMatchedRaga = matches.length > 0;
        const ragaNames = hasMatchedRaga
          ? matches.map(m => m.name).join(', ')
          : 'NA';

        const cardClass = hasMatchedRaga ? 'possibility-card matched-card' : 'possibility-card';

        html += `
          <div class="${cardClass}">
            <div class="lbl-possibility">Possibility ${scaleIdx + 1}</div>
            
            <div class="scale-line">
              <span class="lbl-derived-scale">Derived Scale:</span>
              <span class="swara-scale-val">${fullScaleStr}</span>
            </div>

            <div class="raga-line">
              <span class="lbl-raga">Raga:</span>
              <span class="${hasMatchedRaga ? 'raga-val-text' : 'no-match-text'}">${ragaNames}</span>
            </div>
          </div>
        `;
      });
    }

    html += `
        </div> <!-- End possibilities-container -->
      </div> <!-- End shift-row -->
    `;
  });

  outputArea.innerHTML = html;
}

function clearMatches() {
  document.querySelectorAll('.swara-btn').forEach(btn => btn.classList.remove('selected'));
  document.querySelectorAll('.btn-action').forEach(btn => btn.classList.remove('active-mode'));
  document.getElementById('outputArea').innerHTML = `
    <div class="output-header">
      <span>Graha Bhedam Results & Matching Ragas</span>
      <div id="dbStatus" class="db-badge ${isDatabaseLoaded ? 'success' : 'loading'}">
        ${isDatabaseLoaded ? `✓ Database Active (${ragasDatabase.length} Ragas)` : 'Loading Ragas_Table.csv...'}
      </div>
    </div>
    <p style="color: #555; font-style: italic;">Select swaras on the grid above and click a match button to generate modal shifts and view matching ragas.</p>
  `;
}

// Bind Event Listeners
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.swara-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('selected');
    });
  });

  document.getElementById('btn-aarohanam').addEventListener('click', function() {
    computeAndMatch('aarohanam', this);
  });
  document.getElementById('btn-both').addEventListener('click', function() {
    computeAndMatch('both', this);
  });
  document.getElementById('btn-avarohanam').addEventListener('click', function() {
    computeAndMatch('avarohanam', this);
  });
  document.getElementById('btn-melakarta').addEventListener('click', function() {
    computeAndMatch('melakarta', this);
  });

  document.getElementById('btn-clear').addEventListener('click', clearMatches);
});
</script>
</body>
